name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Native plugin metadata
        uses: actions/checkout@v4
        with:
          repository: withnative/native-plugin
          ref: bf2504030bf714acf5ab954c5f057deef9748951
          path: .validation/native-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace contract
        run: python3 scripts/validate.py --native-plugin-dir .validation/native-plugin
      - name: Validate canonical Native package
        run: python3 .validation/native-plugin/scripts/validate.py
