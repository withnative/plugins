name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the Native ref from the marketplace manifest
        id: native-ref
        run: |
          ref="$(jq -er '.plugins[] | select(.name == "native") | .source.ref' \
            .claude-plugin/marketplace.json)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Native marketplace ref: $ref"
      - name: Check out Native plugin metadata
        uses: actions/checkout@v4
        with:
          repository: withnative/native-plugin
          ref: ${{ steps.native-ref.outputs.ref }}
          path: .validation/native-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace contract
        run: |
          python3 scripts/validate.py \
            --native-plugin-dir .validation/native-plugin \
            --check-remote-refs
      - name: Validate canonical Native package
        run: python3 .validation/native-plugin/scripts/validate.py
